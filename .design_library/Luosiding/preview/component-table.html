<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-family-base); font-size: var(--font-size-body); color: var(--color-on-surface); }
  .row { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); flex-wrap: wrap; }
  .row.full { display: block; width: 100%; }
  .label { width: 92px; flex-shrink: 0; color: var(--color-muted-foreground); font-size: var(--font-size-caption); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
  .divider { width: 100%; border: none; border-top: 1px solid var(--color-border); margin: var(--space-2) 0; }
  /* @component-css-start */
  .table-wrap { width: 100%; border: 1px solid var(--color-border); border-radius: var(--radius-md); overflow: hidden; background: var(--color-surface); }
  table { width: 100%; border-collapse: collapse; }
  th, td { height: 44px; padding: 0 var(--space-3); text-align: left; border-bottom: 1px solid var(--color-border); white-space: nowrap; }
  th { font-weight: var(--font-weight-h4); color: var(--color-muted-foreground); background: var(--color-surface-container-low); }
  tbody tr { transition: background var(--duration-fast) var(--easing-default); }
  tbody tr:hover { background: var(--interactive-hover); }
  tbody tr.selected { background: var(--color-primary-container); color: var(--color-on-primary-container); }
  tbody tr.selected a { color: var(--color-on-primary-container); }
  tbody tr:last-child td { border-bottom: none; }
  .col-sel { width: 40px; }
  .ck { width: 16px; height: 16px; flex-shrink: 0; border: 1px solid var(--color-border); border-radius: var(--radius-sm); appearance: none; margin: 0; }
  .ck:checked { background: var(--color-primary); border-color: var(--color-primary); }
  .act { color: var(--color-primary); text-decoration: none; font-size: var(--font-size-caption); transition: color var(--duration-fast) var(--easing-default); }
  .act:hover { color: var(--color-primary-hover); }
  .empty { display: flex; align-items: center; justify-content: center; height: 120px; color: var(--color-muted-foreground); font-size: var(--font-size-body); }
  /* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">默认</span></div>
<div class="row full"><div class="table-wrap"><table>
  <thead><tr><th class="col-sel"><input type="checkbox" class="ck"></th><th>任务名称</th><th>状态</th><th>平台</th><th>创建时间</th><th>操作</th></tr></thead>
  <tbody>
    <tr><td><input type="checkbox" class="ck"></td><td>夏日穿搭成片</td><td>运行中</td><td>小红书</td><td>2024-05-20</td><td><a href="#" class="act">编辑</a> <a href="#" class="act">删除</a></td></tr>
    <tr><td><input type="checkbox" class="ck"></td><td>美食探店剪辑</td><td>已完成</td><td>抖音</td><td>2024-05-18</td><td><a href="#" class="act">编辑</a> <a href="#" class="act">删除</a></td></tr>
    <tr><td><input type="checkbox" class="ck"></td><td>数码评测脚本</td><td>待开始</td><td>B站</td><td>2024-05-15</td><td><a href="#" class="act">编辑</a> <a href="#" class="act">删除</a></td></tr>
  </tbody>
</table></div></div>
<hr class="divider">
<div class="row"><span class="label">选中</span></div>
<div class="row full"><div class="table-wrap"><table>
  <thead><tr><th class="col-sel"><input type="checkbox" class="ck" checked></th><th>任务名称</th><th>状态</th><th>平台</th><th>创建时间</th><th>操作</th></tr></thead>
  <tbody>
    <tr class="selected"><td><input type="checkbox" class="ck" checked></td><td>品牌宣传片</td><td>运行中</td><td>小红书</td><td>2024-05-21</td><td><a href="#" class="act">编辑</a> <a href="#" class="act">删除</a></td></tr>
  </tbody>
</table></div></div>
<div class="row"><span class="label">空状态</span></div>
<div class="row full"><div class="table-wrap"><div class="empty">暂无数据，请新建任务</div></div></div>
</body>
</html>
