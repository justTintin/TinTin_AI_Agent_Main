<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:var(--space-3); background:var(--color-background); font-family:var(--font-family-base); }
  .row { display:flex; align-items:center; gap:var(--space-2); margin-bottom:var(--space-2); flex-wrap:wrap; }
  .label { width:92px; flex-shrink:0; font-size:var(--font-size-caption); color:var(--color-muted-foreground); }
  .divider { border:none; border-top:1px solid var(--color-border); margin:var(--space-2) 0; }
  /* @component-css-start */
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:var(--space-1); border:1px solid transparent; border-radius:var(--radius-md); font-family:var(--font-family-base); font-weight:var(--font-weight-caption); white-space:nowrap; cursor:pointer; transition:background var(--duration-fast), border-color var(--duration-fast), filter var(--duration-fast), opacity var(--duration-fast); }
  .size-sm { height:var(--size-button-height-sm); min-width:var(--size-button-height-sm); padding:0 var(--space-2); font-size:var(--font-size-caption); }
  .size-md { height:var(--size-button-height); min-width:var(--size-button-height); padding:0 var(--space-3); font-size:var(--font-size-body); }
  .size-lg { height:var(--size-button-height-lg); min-width:var(--size-button-height-lg); padding:0 var(--space-4); font-size:var(--font-size-lead); }
  .primary { background:var(--color-primary); color:var(--color-on-primary); }
  .primary:hover { background:var(--color-primary-hover); }
  .secondary { background:var(--color-secondary); color:var(--color-on-secondary-container); border-color:var(--color-border); }
  .secondary:hover { background:var(--color-surface-container-high); }
  .ghost { background:var(--color-surface); color:var(--color-on-surface); border-color:var(--color-border); }
  .ghost:hover { background:var(--interactive-hover); }
  .danger { background:var(--color-error); color:var(--color-on-error); }
  .danger:hover { filter:brightness(1.08); }
  .icon { background:var(--color-surface); color:var(--color-muted-foreground); border-color:var(--color-border); padding:0; width:var(--size-button-height); }
  .icon.size-sm { width:var(--size-button-height-sm); }
  .icon.size-md { width:var(--size-button-height); }
  .icon.size-lg { width:var(--size-button-height-lg); }
  .icon:hover { background:var(--interactive-hover); color:var(--color-on-surface); }
  .btn:disabled, .btn.loading { opacity:.5; cursor:not-allowed; pointer-events:none; }
  .spin { animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  /* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">主要</span><button class="btn primary size-md">创建任务</button><button class="btn primary size-md" disabled>创建任务</button><button class="btn primary size-md loading"><img class="spin" src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/loader-2.svg" width="16" height="16" alt="">创建任务</button></div>
<div class="row"><span class="label">次要</span><button class="btn secondary size-md">保存设置</button><button class="btn secondary size-md" disabled>保存设置</button><button class="btn secondary size-md loading"><img class="spin" src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/loader-2.svg" width="16" height="16" alt="">保存设置</button></div>
<div class="row"><span class="label">幽灵</span><button class="btn ghost size-md">查看详情</button><button class="btn ghost size-md" disabled>查看详情</button><button class="btn ghost size-md loading"><img class="spin" src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/loader-2.svg" width="16" height="16" alt="">查看详情</button></div>
<div class="row"><span class="label">危险</span><button class="btn danger size-md">删除项目</button><button class="btn danger size-md" disabled>删除项目</button><button class="btn danger size-md loading"><img class="spin" src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/loader-2.svg" width="16" height="16" alt="">删除项目</button></div>
<div class="row"><span class="label">图标</span><button class="btn icon size-md"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/plus.svg" width="20" height="20" alt=""></button><button class="btn icon size-md" disabled><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/plus.svg" width="20" height="20" alt=""></button><button class="btn icon size-md loading"><img class="spin" src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/loader-2.svg" width="20" height="20" alt=""></button></div>
<hr class="divider">
<div class="row"><span class="label">小尺寸</span><button class="btn primary size-sm">创建任务</button><button class="btn secondary size-sm">保存设置</button><button class="btn ghost size-sm">查看</button><button class="btn danger size-sm">删除</button><button class="btn icon size-sm"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/plus.svg" width="16" height="16" alt=""></button></div>
<div class="row"><span class="label">中尺寸</span><button class="btn primary size-md">创建任务</button><button class="btn secondary size-md">保存设置</button><button class="btn ghost size-md">查看</button><button class="btn danger size-md">删除</button><button class="btn icon size-md"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/plus.svg" width="20" height="20" alt=""></button></div>
<div class="row"><span class="label">大尺寸</span><button class="btn primary size-lg">创建任务</button><button class="btn secondary size-lg">保存设置</button><button class="btn ghost size-lg">查看</button><button class="btn danger size-lg">删除</button><button class="btn icon size-lg"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/plus.svg" width="24" height="24" alt=""></button></div>
</body>
</html>
