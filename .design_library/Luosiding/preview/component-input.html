<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:var(--space-3); background:var(--color-background); font-family:var(--font-family-base); }
  .row { display:flex; align-items:center; gap:var(--space-2); margin-bottom:var(--space-2); flex-wrap:wrap; }
  .label { width:92px; flex-shrink:0; font-size:var(--font-size-caption); color:var(--color-muted-foreground); }
  .divider { border:none; border-top:1px solid var(--color-border); margin:var(--space-2) 0; }
  /* @component-css-start */
  .input-wrap { position:relative; flex:1; min-width:0; max-width:240px; }
  .input { width:100%; height:var(--size-input-height); padding:0 var(--space-3); background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-md); color:var(--color-on-surface); font-family:var(--font-family-base); font-size:var(--font-size-body); outline:none; transition:border-color var(--duration-fast), box-shadow var(--duration-fast); box-sizing:border-box; }
  .input::placeholder { color:var(--color-muted-foreground); }
  .input.search { padding-left:var(--space-7); }
  .input-icon { position:absolute; left:var(--space-2); top:50%; transform:translateY(-50%); width:var(--size-icon-md); height:var(--size-icon-md); pointer-events:none; }
  .input:focus { border-color:var(--color-primary); box-shadow:0 0 0 2px var(--ring); }
  .input.error { border-color:var(--color-error); background:var(--color-error-container); color:var(--color-on-error-container); }
  .input:disabled { opacity:.5; cursor:not-allowed; }
  .textarea { min-height:72px; padding:var(--space-2) var(--space-3); resize:vertical; line-height:var(--line-height-body); }
  .hint { font-size:var(--font-size-caption); color:var(--color-error); margin-top:var(--space-1); }
  /* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">文本</span><input class="input" type="text" placeholder="请输入任务名称"></div>
<div class="row"><span class="label">搜索</span><div class="input-wrap"><img class="input-icon" src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/search.svg" width="20" height="20" alt=""><input class="input search" type="search" placeholder="搜索素材"></div></div>
<div class="row"><span class="label">文本域</span><textarea class="input textarea" placeholder="输入详细描述"></textarea></div>
<div class="row"><span class="label">数字</span><input class="input" type="number" placeholder="0"></div>
<hr class="divider">
<div class="row"><span class="label">聚焦</span><input class="input" type="text" placeholder="已聚焦" autofocus></div>
<div class="row"><span class="label">错误</span><div class="input-wrap"><input class="input error" type="text" value="无效输入"><div class="hint">请输入正确的项目名称</div></div></div>
<div class="row"><span class="label">禁用</span><input class="input" type="text" value="不可编辑" disabled></div>
</body>
</html>
