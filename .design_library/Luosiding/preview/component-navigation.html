<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-family-base); font-size: var(--font-size-body); color: var(--color-on-surface); }
  .row { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { width: 92px; flex-shrink: 0; color: var(--color-muted-foreground); font-size: var(--font-size-caption); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
  .divider { width: 100%; border: none; border-top: 1px solid var(--color-border); margin: var(--space-2) 0; }
  /* @component-css-start */
  .sb-item { display: inline-flex; align-items: center; gap: var(--space-2); width: 208px; height: var(--size-button-height); padding: 0 var(--space-3); border-radius: var(--radius-md); color: var(--color-on-surface); background: transparent; cursor: pointer; transition: background var(--duration-fast) var(--easing-default); white-space: nowrap; }
  .sb-item img { width: var(--size-icon-md); height: var(--size-icon-md); flex-shrink: 0; opacity: 0.85; }
  .sb-item:hover { background: var(--interactive-hover); }
  .sb-item.active { background: var(--color-primary-container); color: var(--color-on-primary-container); box-shadow: inset 3px 0 0 0 var(--color-primary); }
  .sb-item.active img { opacity: 1; }
  .tab { display: inline-flex; align-items: center; height: var(--size-button-height); padding: 0 var(--space-3); border-radius: var(--radius-md); color: var(--color-on-surface-variant); cursor: pointer; transition: background var(--duration-fast) var(--easing-default), color var(--duration-fast) var(--easing-default); white-space: nowrap; }
  .tab:hover { background: var(--interactive-hover); color: var(--color-on-surface); }
  .tab.active { background: var(--color-primary-container); color: var(--color-on-primary-container); font-weight: var(--font-weight-h4); }
  .bc { display: inline-flex; align-items: center; gap: var(--space-1); color: var(--color-muted-foreground); font-size: var(--font-size-body); white-space: nowrap; }
  .bc a { color: var(--color-muted-foreground); text-decoration: none; transition: color var(--duration-fast) var(--easing-default); }
  .bc a:hover { color: var(--color-on-surface); }
  .bc .current { color: var(--color-on-surface); }
  .bc img { width: var(--size-icon-sm); height: var(--size-icon-sm); flex-shrink: 0; opacity: 0.6; }
  /* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">侧边栏</span>
  <div class="sb-item"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/home.svg" alt="">首页</div>
  <div class="sb-item active"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/folder-open.svg" alt="">项目</div>
  <div class="sb-item"><img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/settings.svg" alt="">设置</div>
</div>
<div class="row"><span class="label">顶部标签</span>
  <div class="tab">全部任务</div>
  <div class="tab active">成片任务</div>
  <div class="tab">分发记录</div>
</div>
<hr class="divider">
<div class="row"><span class="label">面包屑</span>
  <nav class="bc">
    <a href="#">首页</a>
    <img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/chevron-right.svg" alt="">
    <a href="#">项目</a>
    <img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/chevron-right.svg" alt="">
    <span class="current">成片任务</span>
  </nav>
</div>
</body>
</html>
