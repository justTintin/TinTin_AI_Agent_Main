<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>抖店自动化上架工作台</title>
  <style>
    body { margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f0f2f5; }
    
    /* 顶部标签栏 */
    #tab-bar { display: flex; background: #dfe1e5; border-bottom: 1px solid #ccc; padding-top: 8px; padding-left: 8px; }
    .tab { padding: 10px 20px; margin-right: 4px; background: #f1f3f4; border: 1px solid #ccc; border-bottom: none; border-radius: 8px 8px 0 0; cursor: pointer; user-select: none; color: #5f6368; font-size: 14px; display: flex; align-items: center; }
    .tab:hover:not(.active) { background: #e8eaed; }
    .tab.active { background: #fff; font-weight: bold; color: #1a73e8; position: relative; top: 1px; border-bottom: 1px solid #fff; }
    
    /* 视图容器 */
    #view-container { flex: 1; position: relative; background: #fff; display: flex; flex-direction: column; overflow: hidden; }
    .view { position: absolute; top: 0; left: -200vw; width: 100%; height: 100%; display: flex; flex-direction: column; visibility: hidden; }
    .view.active { left: 0; visibility: visible; }
    
    /* 首页布局 */
    .home-layout { display: flex; flex: 1; padding: 20px; gap: 20px; background: #f8f9fa; overflow: hidden; }
    .panel { background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #e0e0e0; display: flex; flex-direction: column; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .left-panel { flex: 0 0 350px; display: flex; flex-direction: column; gap: 20px; }
    .right-panel { flex: 1; display: flex; flex-direction: column; position: relative; }
    
    h3 { margin-top: 0; color: #202124; font-size: 16px; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
    
    /* 表单样式 */
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 6px; font-weight: bold; color: #3c4043; font-size: 13px; }
    .form-group input, .form-group select { width: 100%; padding: 8px 10px; border: 1px solid #dadce0; border-radius: 4px; box-sizing: border-box; outline: none; }
    .form-group input:focus, .form-group select:focus { border-color: #1a73e8; }
    
    /* 按钮样式 */
    .btn { padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 13px; display: inline-flex; align-items: center; justify-content: center; transition: background 0.2s; }
    .btn-primary { background: #1a73e8; color: #fff; width: 100%; }
    .btn-primary:hover { background: #1557b0; }
    .btn-success { background: #188038; color: #fff; }
    .btn-success:hover { background: #13652c; }
    .btn-danger { background: #d93025; color: #fff; }
    .btn-danger:hover { background: #b3261e; }
    
    /* 队列样式 */
    .queue-list { list-style: none; padding: 0; margin: 0; overflow-y: auto; flex: 1; }
    .queue-item { padding: 12px; border: 1px solid #e0e0e0; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; }
    
    /* 日志弹窗样式 (Modal) */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 1000; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: #fff; width: 80%; max-width: 900px; height: 80%; border-radius: 8px; display: flex; flex-direction: column; box-shadow: 0 4px 20px rgba(0,0,0,0.15); overflow: hidden; }
    .modal-header { padding: 15px 20px; background: #f1f3f4; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e0e0e0; }
    .modal-header h3 { margin: 0; font-size: 16px; border: none; padding: 0; }
    .modal-close { cursor: pointer; font-size: 20px; color: #5f6368; background: none; border: none; padding: 0 5px; }
    .modal-close:hover { color: #d93025; }
    .log-box { flex: 1; background: #202124; color: #34a853; padding: 15px; font-family: Consolas, 'Courier New', monospace; font-size: 13px; overflow-y: auto; white-space: pre-wrap; line-height: 1.5; margin: 0; user-select: text; }
    .log-actions { padding: 10px 20px; background: #f8f9fa; border-top: 1px solid #e0e0e0; display: flex; justify-content: flex-end; }
    
    /* 店铺浏览器样式 */
    .browser-toolbar { display: flex; padding: 8px 12px; background: #f1f3f4; border-bottom: 1px solid #dadce0; align-items: center; gap: 8px; }
    .browser-toolbar button { padding: 6px; cursor: pointer; border: 1px solid #dadce0; background: #fff; border-radius: 4px; display: flex; align-items: center; justify-content: center; color: #5f6368; }
    .browser-toolbar button:hover { background: #f8f9fa; color: #202124; }
    .browser-toolbar input { flex: 1; padding: 6px 12px; border: 1px solid #dadce0; border-radius: 20px; outline: none; font-size: 13px; color: #202124; background: #fff; }
    .browser-toolbar input:focus { border-color: #1a73e8; box-shadow: 0 0 0 1px rgba(26,115,232,0.2); }
    webview { flex: 1; border: none; background: #fff; }
    
    /* 状态颜色 */
    .text-pending { color: #5f6368; }
    .text-running { color: #f29900; font-weight: bold; }
    .text-completed { color: #188038; font-weight: bold; }
    .text-error { color: #d93025; font-weight: bold; }
    
    /* 任务列表操作按钮 */
    .task-actions { display: flex; gap: 5px; margin-top: 5px; }
    .task-actions button { padding: 4px 8px; font-size: 12px; border: 1px solid #dadce0; background: #fff; border-radius: 4px; cursor: pointer; color: #5f6368; }
    .task-actions button:hover { background: #f1f3f4; color: #202124; }
    .task-actions .btn-run { color: #188038; border-color: #188038; }
    .task-actions .btn-run:hover { background: #e6f4ea; }
    .task-actions .btn-stop { color: #d93025; border-color: #d93025; }
    .task-actions .btn-stop:hover { background: #fce8e6; }
  </style>
</head>
<body>

  <!-- 顶部 Tab 栏 -->
  <div id="tab-bar">
    <div class="tab active" onclick="switchTab('home', this)">🏠 任务控制台</div>
    <div class="tab" onclick="switchTab('juyou', this)">📦 店铺：桔柚数码</div>
    <div class="tab" onclick="switchTab('555_battery', this)">🔋 店铺：555电池</div>
  </div>

  <div id="view-container">
    <!-- ========================================== -->
    <!-- 首页：任务控制台 (提交任务、队列、日志) -->
    <!-- ========================================== -->
    <div id="view-home" class="view active">
      <div class="home-layout">
        
        <!-- 左侧面板：表单与设置 -->
        <div class="left-panel">
          
          <!-- 提交任务表单 -->
          <div class="panel">
            <h3>➕ 新增上架任务</h3>
            <div class="form-group">
              <label>目标店铺 (不同店铺环境隔离)</label>
              <select id="shopSelect">
                <option value="juyou">桔柚数码外设严选 (juyou)</option>
                <option value="555_battery">555井韵电池店铺 (555_battery)</option>
              </select>
            </div>
            <div class="form-group">
              <label>数据包目录 (包含 sku.xlsx)</label>
              <div style="display:flex; gap:8px;">
                <button class="btn" style="width:auto; flex:0 0 100px; background:#e8f0fe; color:#1a73e8; border:1px solid #1a73e8;" onclick="pickDataDir()">📂 选择目录</button>
                <div id="selectedPathDisplay" style="flex:1; font-size:12px; color:#666; background:#f8f9fa; border:1px solid #dadce0; border-radius:4px; padding:8px; word-break:break-all; min-height:34px; display:flex; align-items:center;">未选择目录</div>
              </div>
              <input type="hidden" id="dataPath">
            </div>
            <div class="form-group">
              <label>任务标识 (系统自动生成)</label>
              <input type="text" id="taskName" readonly style="background-color: #f1f3f4; color: #5f6368;" placeholder="选择数据包后自动生成">
            </div>
            <button class="btn btn-primary" onclick="addTask()">加入执行队列</button>
          </div>
          
          <!-- 其他设置/控制项 -->
          <div class="panel" style="flex: 1;">
            <h3>⚙️ 系统控制</h3>
            <div style="margin-top: 10px;">
              <button class="btn" style="width:100%; background:#f1f3f4; color:#202124; border:1px solid #dadce0;" onclick="toggleLog()">
                <span id="logIconBtn">👁️ 展开系统运行日志</span>
              </button>
            </div>
          </div>
          
        </div>
        
        <!-- 右侧面板：主视图区域 -->
        <div class="right-panel" style="background: #fff; border-radius: 8px; border: 1px solid #e0e0e0; overflow: hidden; display: flex; flex-direction: column;">
          
          <!-- 大面积：排队执行队列 -->
          <div style="flex: 1; display: flex; flex-direction: column; padding: 20px; overflow: hidden;">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px; border-bottom: 1px solid #f0f0f0; padding-bottom: 10px;">
              <h3 style="margin:0; border:none; padding:0;">⏳ 任务排队执行与状态</h3>
              <div style="display:flex; gap:5px;">
                <button class="btn btn-success" style="padding: 6px 12px;" onclick="startQueue()">▶ 开始执行队列</button>
                <button class="btn btn-danger" style="padding: 6px 12px;" onclick="stopQueue()">⏹ 强制停止</button>
              </div>
            </div>
            <ul id="queueList" class="queue-list" style="padding: 10px; background: #fafafa; border-radius: 6px; border: 1px inset #eee;">
              <li style="text-align:center; color:#999; margin-top:20px; font-size: 14px;">暂无排队任务，请在左侧提交</li>
            </ul>
          </div>
          
          <!-- 底部：折叠日志抽屉 已被移除，改为使用全局 Modal -->
          
        </div>
        
      </div>
    </div>

    <!-- ========================================== -->
    <!-- 店铺视图：桔柚数码 -->
    <!-- ========================================== -->
    <div id="view-juyou" class="view">
      <div class="browser-toolbar">
        <button onclick="document.getElementById('wv-juyou').goBack()" title="后退">◀</button>
        <button onclick="document.getElementById('wv-juyou').goForward()" title="前进">▶</button>
        <button onclick="document.getElementById('wv-juyou').reload()" title="刷新">↻</button>
        <input type="text" id="url-juyou" value="https://fxg.jinritemai.com/ffa/mmain/dashboard" readonly style="background-color: #f8f9fa;">
      </div>
      <webview id="wv-juyou" src="https://fxg.jinritemai.com/ffa/mmain/dashboard" partition="persist:juyou" useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36 ShopKey-juyou" allowpopups></webview>
    </div>

    <!-- ========================================== -->
    <!-- 店铺视图：555电池 -->
    <!-- ========================================== -->
    <div id="view-555_battery" class="view">
      <div class="browser-toolbar">
        <button onclick="document.getElementById('wv-555_battery').goBack()" title="后退">◀</button>
        <button onclick="document.getElementById('wv-555_battery').goForward()" title="前进">▶</button>
        <button onclick="document.getElementById('wv-555_battery').reload()" title="刷新">↻</button>
        <input type="text" id="url-555_battery" value="https://fxg.jinritemai.com/ffa/mmain/dashboard" readonly style="background-color: #f8f9fa;">
      </div>
      <webview id="wv-555_battery" src="https://fxg.jinritemai.com/ffa/mmain/dashboard" partition="persist:555_battery" useragent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36 ShopKey-555_battery" allowpopups></webview>
    </div>
    
  </div>

  <!-- 日志模态弹窗 (Modal) -->
  <div id="logModal" class="modal-overlay" onclick="if(event.target===this) toggleLog()">
    <div class="modal-content">
      <div class="modal-header">
        <h3>📝 系统输出日志</h3>
        <button class="modal-close" onclick="toggleLog()" title="关闭">×</button>
      </div>
      <div id="logBox" class="log-box"></div>
      <div class="log-actions">
        <button class="btn" style="background:#f1f3f4; color:#202124; border:1px solid #dadce0;" onclick="copyLogs()">📋 复制日志内容</button>
        <button class="btn btn-primary" style="margin-left: 10px; width: auto;" onclick="toggleLog()">确定 (关闭)</button>
      </div>
    </div>
  </div>

  <script>
    // --- 选项卡切换逻辑 ---
    function switchTab(tabId, element) {
      // 移除所有 Tab 的 active 状态
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      
      if (element) {
        element.classList.add('active');
      } else {
        // 自动查找并激活对应的 Tab
        const tabs = Array.from(document.querySelectorAll('.tab'));
        const targetTab = tabs.find(t => t.getAttribute('onclick').includes(tabId));
        if (targetTab) targetTab.classList.add('active');
      }
      
      // 移除所有 View 的 active 状态，激活目标 View
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.getElementById('view-' + tabId).classList.add('active');
    }

    // --- Webview 初始化与同步地址栏 ---
    ['juyou', '555_battery'].forEach(shop => {
      const wv = document.getElementById('wv-' + shop);
      const urlInput = document.getElementById('url-' + shop);
      
      // 同步真实 URL 到地址栏
      wv.addEventListener('did-navigate', (e) => { urlInput.value = e.url; });
      wv.addEventListener('did-navigate-in-page', (e) => { urlInput.value = e.url; });
      
      // 关键：在 DOM 就绪时注入变量，让 Playwright 能识别这是哪个店铺的页面
      wv.addEventListener('dom-ready', () => {
        wv.executeJavaScript(`window.__shopKey = '${shop}';`);
      });
    });

    // --- 自动生成任务标识逻辑 ---
    let currentSelectedDir = '';

    async function pickDataDir() {
      const path = await window.electronAPI.selectDirectory();
      if (path) {
        currentSelectedDir = path;
        document.getElementById('dataPath').value = path;
        document.getElementById('selectedPathDisplay').innerText = path;
        updateTaskName();
        log(`📂 已选择目录: ${path}`);
      }
    }

    function updateTaskName() {
      if (!currentSelectedDir) {
        document.getElementById('taskName').value = '';
        return;
      }
      
      // 从路径中提取最后一个文件夹名
      let folderName = currentSelectedDir.split(/[\\/]/).pop() || '数据包';

      // 获取店铺简称
      const shopKey = document.getElementById('shopSelect').value;
      const shopShortName = shopKey === 'juyou' ? '桔柚' : '555电池';
      
      const now = new Date();
      const timeStr = now.getFullYear().toString() + 
                      (now.getMonth() + 1).toString().padStart(2, '0') + 
                      now.getDate().toString().padStart(2, '0') + 
                      now.getHours().toString().padStart(2, '0') + 
                      now.getMinutes().toString().padStart(2, '0') +
                      now.getSeconds().toString().padStart(2, '0');

      document.getElementById('taskName').value = `${timeStr}-${shopShortName}-${folderName}`;
    }

    document.getElementById('shopSelect').addEventListener('change', updateTaskName);

    // --- 任务队列与日志逻辑 ---
    let queue = [];
    let isRunning = false;

    function toggleLog() {
      const modal = document.getElementById('logModal');
      modal.classList.toggle('active');
    }

    async function addTask() {
      const taskName = document.getElementById('taskName').value.trim();
      const shopKey = document.getElementById('shopSelect').value;
      const shopName = document.getElementById('shopSelect').options[document.getElementById('shopSelect').selectedIndex].text;
      const dataDir = currentSelectedDir;
      
      if (!dataDir) {
        return alert('请先选择包含 sku.xlsx 的数据包目录');
      }

      // 通过 IPC 调用主进程进行深层校验
      const check = await window.electronAPI.validateDataDir(dataDir);
      if (!check.success || !check.hasSku) {
        return alert(`数据校验失败：${check.reason || '目录中未找到 sku.xlsx 文件'}`);
      }

      if (!taskName) return alert('任务标识生成异常，请重新选择目录');
      if (queue.some(t => t.taskName === taskName)) return alert('该数据包已被添加到任务队列中');

      // 存入 dataDir 供后台使用
      queue.push({ taskName, shopKey, shopName, status: 'pending', dataDir });
      log(`📝 任务已提交排队: [${taskName}] -> 目标店铺: ${shopName}`);
      renderQueue();

      // 添加成功后清空
      currentSelectedDir = '';
      document.getElementById('dataPath').value = '';
      document.getElementById('selectedPathDisplay').innerText = '未选择目录';
      document.getElementById('taskName').value = '';
    }

    function copyLogs() {
      const logBox = document.getElementById('logBox');
      navigator.clipboard.writeText(logBox.innerText).then(() => {
        alert('日志内容已复制到剪贴板！');
      }).catch(err => {
        alert('复制失败: ' + err);
      });
    }

    function log(msg) {
      const logBox = document.getElementById('logBox');
      const time = new Date().toLocaleTimeString();
      logBox.innerHTML += `[${time}] ${msg}\n`;
      // 自动滚动到底部
      logBox.scrollTop = logBox.scrollHeight;
    }

    window.electronAPI.onTaskStatus(({ taskName, status, message }) => {
      const task = queue.find(t => t.taskName === taskName);
      if (task) {
        task.status = status;
        log(`[${taskName}] [${status.toUpperCase()}] ${message}`);
        renderQueue();
        
        // 任务结束，自动调度下一个
        if (status === 'completed' || status === 'error') {
          processNext();
        }
      }
    });

    function renderQueue() {
      const list = document.getElementById('queueList');
      if (queue.length === 0) {
        list.innerHTML = '<li style="text-align:center; color:#999; margin-top:20px; font-size: 13px;">暂无排队任务</li>';
        return;
      }
      
      list.innerHTML = '';
      queue.forEach(task => {
        const li = document.createElement('li');
        li.className = 'queue-item';
        
        let statusClass = `text-${task.status}`;
        let statusStr = task.status === 'pending' ? '⏳ 待执行' : 
                        task.status === 'running' ? '🚀 执行中' : 
                        task.status === 'completed' ? '✅ 完成' : '❌ 失败';
                        
        let actionHtml = '';
        if (task.status === 'pending') {
          actionHtml = `
            <button class="btn-run" onclick="runSingleTask('${task.taskName}')">▶ 优先执行</button>
            <button class="btn-stop" onclick="removeTask('${task.taskName}')">🗑 删除</button>
          `;
        } else if (task.status === 'running') {
          actionHtml = `<button class="btn-stop" onclick="stopQueue()">⏹ 停止</button>`;
        } else if (task.status === 'error') {
          actionHtml = `
            <button class="btn-run" onclick="retryTask('${task.taskName}')">🔄 重新尝试</button>
            <button class="btn-stop" onclick="removeTask('${task.taskName}')">🗑 删除</button>
          `;
        } else if (task.status === 'completed') {
          actionHtml = `<button class="btn-stop" onclick="removeTask('${task.taskName}')">🗑 删除</button>`;
        }

        li.innerHTML = `
          <div style="font-size: 13px;">
            <strong style="color: #1a73e8;">${task.taskName}</strong><br>
            <small style="color:#666">${task.shopName}</small>
          </div>
          <div style="display:flex; flex-direction:column; align-items:flex-end;">
            <div class="${statusClass}" style="font-size: 13px;">${statusStr}</div>
            <div class="task-actions">${actionHtml}</div>
          </div>
        `;
        list.appendChild(li);
      });
    }

    // --- 单个任务操作控制 ---
    function retryTask(taskName) {
      const task = queue.find(t => t.taskName === taskName);
      if (task) {
        task.status = 'pending';
        log(`🔄 任务 [${taskName}] 已重新加入队列`);
        renderQueue();
        // 如果当前没有运行的任务，自动开始
        if (!isRunning) startQueue();
      }
    }

    function removeTask(taskName) {
      const idx = queue.findIndex(t => t.taskName === taskName);
      if (idx === -1) return;
      if (queue[idx].status === 'running') {
        return alert('任务正在执行中，请先停止再删除。');
      }
      queue.splice(idx, 1);
      log(`🗑 任务 [${taskName}] 已删除`);
      renderQueue();
    }

    async function runSingleTask(taskName) {
      if (isRunning) {
        return alert('当前已有任务正在执行，请先停止，或等待排队。');
      }
      
      const task = queue.find(t => t.taskName === taskName);
      if (task && task.status === 'pending') {
        isRunning = true;
        log(`\n======================================`);
        log(`🚀 手动优先执行任务: ${task.taskName}`);
        log(`======================================`);
        
        task.status = 'running';
        renderQueue();
        // 取消强制切换，实现真正的后台静默执行
        // switchTab(task.shopKey);
        
        const res = await window.electronAPI.startTask(task);
        if (!res.success && res.message !== 'Task stopped by user') {
          task.status = 'error';
          log(`❌ [致命错误] 任务启动失败: ${res.message}`);
          renderQueue();
          isRunning = false;
        }
      }
    }

    async function processNext() {
      if (!isRunning) return;
      const nextTask = queue.find(t => t.status === 'pending');
      
      if (nextTask) {
        nextTask.status = 'running';
        renderQueue();
        log(`\n======================================`);
        log(`🚀 开始调度任务: ${nextTask.taskName}`);
        log(`======================================`);
        
        // 不再强制切换 Tab，实现真正的后台静默执行
        // switchTab(nextTask.shopKey);
        
        const res = await window.electronAPI.startTask(nextTask);
        if (!res.success && res.message !== 'Task stopped by user') {
          nextTask.status = 'error';
          log(`❌ [致命错误] 任务启动失败: ${res.message}`);
          renderQueue();
          processNext(); // 当前失败，继续下一个
        }
      } else {
        isRunning = false;
        log(`\n🎉 队列中所有任务已执行完毕！`);
        // 执行完后切回控制台
        switchTab('home');
      }
    }

    function startQueue() {
      if (isRunning) return;
      if (!queue.some(t => t.status === 'pending')) return alert('没有排队中的待执行任务');
      isRunning = true;
      log('▶ 启动队列执行引擎...');
      processNext();
    }

    async function stopQueue() {
      if (!isRunning) return;
      isRunning = false;
      log('⏹ 正在强制终止当前任务...');
      
      const res = await window.electronAPI.stopTask();
      const active = queue.find(t => t.status === 'running');
      if (active) {
        active.status = 'error';
        log(`❌ 任务 [${active.taskName}] 已被用户手动终止。`);
        renderQueue();
      }
    }
  </script>
</body>
</html>
