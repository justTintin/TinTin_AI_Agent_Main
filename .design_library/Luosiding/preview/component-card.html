<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin:0; padding:var(--space-3); background:var(--color-background); font-family:var(--font-family-base); }
  .row { display:flex; align-items:center; gap:var(--space-2); margin-bottom:var(--space-2); flex-wrap:wrap; }
  .label { width:92px; flex-shrink:0; font-size:var(--font-size-caption); color:var(--color-muted-foreground); }
  .divider { border:none; border-top:1px solid var(--color-border); margin:var(--space-2) 0; }
  /* @component-css-start */
  .card { position:relative; flex:1; min-width:0; background:var(--color-card); border:1px solid var(--color-border); border-radius:var(--radius-xl); box-shadow:var(--shadow-1); padding:var(--space-4); overflow:hidden; transition:border-color var(--duration-fast), box-shadow var(--duration-fast); cursor:pointer; }
  .card:hover { border-color:var(--color-primary); box-shadow:var(--shadow-2); }
  .card:active { box-shadow:var(--shadow-1); }
  .card.disabled { opacity:.5; cursor:not-allowed; pointer-events:none; }
  .accent { position:absolute; top:0; left:0; right:0; height:4px; background:var(--color-primary); }
  .card-icon { width:var(--size-icon-lg); height:var(--size-icon-lg); margin-bottom:var(--space-2); }
  .card-title { font-size:var(--font-size-h4); font-weight:var(--font-weight-h4); color:var(--color-on-surface); }
  .card-desc { font-size:var(--font-size-body); color:var(--color-muted-foreground); margin-top:var(--space-1); line-height:var(--line-height-body); }
  .card-action { display:inline-flex; align-items:center; gap:var(--space-1); margin-top:var(--space-3); font-size:var(--font-size-caption); color:var(--color-primary); font-weight:var(--font-weight-caption); }
  /* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">标准</span><div class="card standard"><div class="card-title">项目概览</div><div class="card-desc">查看当前项目的进度、成员与最近动态。</div><div class="card-action">进入面板 <img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/chevron-right.svg" width="14" height="14" alt=""></div></div></div>
<div class="row"><span class="label">功能入口</span><div class="card feature"><div class="accent"></div><img class="card-icon" src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/zap.svg" width="24" height="24" alt=""><div class="card-title">一键成片</div><div class="card-desc">选择素材后自动生成视频初片，节省剪辑时间。</div><div class="card-action">开始使用 <img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/arrow-right.svg" width="14" height="14" alt=""></div></div></div>
<div class="row"><span class="label">可交互</span><div class="card interactive"><div class="accent"></div><img class="card-icon" src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/search.svg" width="24" height="24" alt=""><div class="card-title">搜索素材</div><div class="card-desc">在资源库中快速查找图片、视频与模板。</div><div class="card-action">立即搜索 <img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/arrow-right.svg" width="14" height="14" alt=""></div></div></div>
<hr class="divider">
<div class="row"><span class="label">禁用</span><div class="card standard disabled"><div class="card-title">创建任务</div><div class="card-desc">当前账号权限不足，无法创建新任务。</div><div class="card-action">申请权限 <img src="https://cdn.jsdelivr.net/npm/lucide-static@1.8.0/icons/chevron-right.svg" width="14" height="14" alt=""></div></div></div>
</body>
</html>
