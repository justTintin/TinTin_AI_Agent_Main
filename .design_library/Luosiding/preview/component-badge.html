<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: var(--space-3); background: var(--color-background); font-family: var(--font-family-base); font-size: var(--font-size-body); color: var(--color-on-surface); }
  .row { display: flex; align-items: center; gap: var(--space-2); margin-bottom: var(--space-2); flex-wrap: wrap; }
  .label { width: 92px; flex-shrink: 0; color: var(--color-muted-foreground); font-size: var(--font-size-caption); text-transform: uppercase; letter-spacing: 0.05em; white-space: nowrap; }
  .divider { width: 100%; border: none; border-top: 1px solid var(--color-border); margin: var(--space-2) 0; }
  /* @component-css-start */
  .badge { display: inline-flex; align-items: center; justify-content: center; gap: var(--space-1); border: none; white-space: nowrap; }
  .badge.sm { height: 20px; min-width: 20px; padding: 0 var(--space-2); border-radius: var(--radius-full); font-size: 11px; font-weight: var(--font-weight-h4); }
  .badge.md { height: 24px; min-width: 24px; padding: 0 10px; border-radius: var(--radius-full); font-size: var(--font-size-caption); font-weight: var(--font-weight-h4); }
  .badge.status-success { background: var(--color-success); color: var(--color-on-primary); }
  .badge.status-warning { background: var(--color-warning); color: var(--color-on-primary); }
  .badge.status-error { background: var(--color-error); color: var(--color-on-primary); }
  .badge.status-info { background: var(--color-info); color: var(--color-on-primary); }
  .badge.platform { background: var(--color-surface-container); color: var(--color-on-surface); border-radius: var(--radius-md); }
  .badge.tag { background: var(--color-secondary-container); color: var(--color-on-secondary-container); border-radius: var(--radius-md); }
  /* @component-css-end */
</style>
</head>
<body>
<div class="row"><span class="label">状态 SM</span>
  <span class="badge sm status-success">运行中</span>
  <span class="badge sm status-warning">待审核</span>
  <span class="badge sm status-error">失败</span>
  <span class="badge sm status-info">排队中</span>
</div>
<div class="row"><span class="label">状态 MD</span>
  <span class="badge md status-success">运行中</span>
  <span class="badge md status-warning">待审核</span>
  <span class="badge md status-error">失败</span>
  <span class="badge md status-info">排队中</span>
</div>
<hr class="divider">
<div class="row"><span class="label">平台 MD</span>
  <span class="badge md platform">小红书</span>
  <span class="badge md platform">B站</span>
  <span class="badge md platform">抖音</span>
</div>
<div class="row"><span class="label">标签</span>
  <span class="badge sm tag">短视频</span>
  <span class="badge sm tag">图文</span>
  <span class="badge md tag">直播回放</span>
</div>
</body>
</html>
